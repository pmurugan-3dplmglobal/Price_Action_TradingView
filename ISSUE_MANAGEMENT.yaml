  - id: ISSUE-037
    title: Split-Brain sl_target_overrides.json Files Clobbered User SL (HCLTECH 20.0 vs 35.46)
    severity: HIGH
    category: Risk Management & SL Override Persistence
    date_reported: "2026-08-10"
    symptom: |
      HCLTECH26AUG1340PE displayed Entry 22.5 / SL 35.46 (SL above entry, -20%) despite active_positions_db.json and
      root sl_target_overrides.json storing SL 20.0. HCLTECH26AUG1360PE showed pattern TIMEFRAME_SWING_MANUAL after user
      SL edit was silently overwritten ("manual entry takes precedence").
    root_cause: |
      1. Dual override files existed: app_option_Trade.py/app_Sock_Trade.py write to project-root output/monitor/sl_target_overrides.json
         (BASE_DIR = project root), while index_options_trade_engine.py & stock_options_trade_engine.py read from
         Trade_Option/output/monitor/sl_target_overrides.json (BASE_DIR = Trade_Option) â€” same contract, different SL values.
      2. lookup_scan_sl_target in common/trading_core.py used next((p for p in paths if exists)) â€” it stopped at the FIRST existing
         path (cwd-relative Trade_Option copy), so a user edit living only in the canonical root file was never found.
      3. On lookup miss, sync_kite_positions fell through to derive_sl_targets_for_contract (TIMEFRAME_SWING_MANUAL / 10% SL),
         overwriting the user-set SL on every new manual KITE_SYNC entry.
      4. reconcile_positions in common/trading_core.py also read a bare cwd-relative "output/monitor/sl_target_overrides.json".
      This is a repeat of the ISSUE-036 family: override persistence was only half-fixed (key matching), the dual-file/cwd split was never addressed.
    affected_files:
      - common/trading_core.py
      - Trade_Option/index_options_trade_engine.py
      - Trade_Option/stock_options_trade_engine.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      1. Added get_override_paths() in common/trading_core.py: returns ordered sl_target_overrides.json candidates with the canonical
         project-root path FIRST (dedup by normalized absolute path).
      2. Rewrote lookup_scan_sl_target override search to iterate ALL existing override paths (canonical first) and pick the best
         match (exact > partial specificity), so a user edit saved under a different cwd is never missed and stale duplicates cannot clobber it.
      3. Pointed SL_TARGET_OVERRIDES_FILE in index_options_trade_engine.py and stock_options_trade_engine.py at the canonical
         project-root path (os.path.dirname(BASE_DIR)) so engine [OVERRIDE] loops and reconcile_positions read the same file the apps write.
      4. reconcile_positions now reads get_override_paths()[0] instead of a bare cwd-relative path.
    status: RESOLVED

  - id: ISSUE-038
    title: TRENT26AUG3000CE Staged Trade Invisible on Option Dashboard Scan Tab
    severity: HIGH
    category: Dashboard / UI Data Pipeline
    family: PATH_SPLIT
    date_reported: "2026-08-10"
    symptom: |
