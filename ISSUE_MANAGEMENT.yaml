      (qty 175) while premium was trading ~80, even though the trigger logged was
      "SL [CANDLE_CLOSE_SL (75min Bar @ 2026-08-10 13:00:00+05:30)]: LT at 50.6" and the DB booked
      pnl -12.68%. Sequence from bull_nifty50_scanner.log:
      10:27:18 TRAIL-1 LT: SL=BE (57.95)   -> 10:28:26 CANDLE_CLOSE_SL exit.
    root_cause: |
      monitor_active_positions CANDLE_CLOSE_SL scan iterates ALL post-entry candles (2-day fetch
