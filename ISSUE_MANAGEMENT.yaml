      appeared on the Option Dashboard (port 5050) Scan Tab. Dashboard showed only 0 staged trades / stale 09:00 data.
    root_cause: |
      PATH_SPLIT family root cause: every module re-derives output paths independently (os.getcwd(), BASE_DIR from
      __file__, bare "output/..." strings), so writes and reads diverged across cwd. Specifically:
      1. stock_options_trade_engine.py / index_options_trade_engine.py wrote staged trades to
         Trade_Option/output/monitor/scan_display_data.json (cwd/BASE_DIR-relative), while app_option_Trade.py
         read only project-root output/monitor/scan_display.json + scan_display_index.json.
      2. Same split-brain duplicated trades_db.json (root: 9 clean trades vs Trade_Option: 353 trades incl.
         NIFTY2680424600CE x70 and POWERGRID26AUG290CE x105 duplicate ACTIVE rows), the scanner log, and
         sl_target_overrides.json â€” the exact ISSUE-037/ISSUE-036 family recurring.
      3. Legacy Trade_Option/output/monitor/scan_display_data.json became a stale orphan after the fix.
    affected_files:
      - common/paths.py
      - Trade_Option/stock_options_trade_engine.py
      - Trade_Option/index_options_trade_engine.py
      - Trade_Stock/stock_bullish_reversal_scanner.py
      - Trade_Stock/stock_bearish_reversal_scanner.py
      - Trade_Option/app_option_Trade.py
      - Trade_Stock/app_Sock_Trade.py
      - common/trading_core.py
      - common/trade_db.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      Canonicalized ALL cross-module file paths through new common/paths.py (PROJECT_ROOT + input_file/monitor_file/
      log_file helpers). Engines now write the same root files the dashboards read:
