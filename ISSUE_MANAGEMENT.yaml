  - id: BUGFIX-001
    title: Blueprint Alignment - Benchmark / Close-Basis / TF Labeling
    severity: BUG
    category: Strategy Logic / Signal Accuracy
    date_reported: 2026-08-11
    symptom: |
      (1) Setup 2 LL Sweep: benchmark = bounce_candle.high, should = sweep_candle.high (Low 2 = A).
      (2) Setup 4 Hammer: benchmark = post_baby.high, should = baby_candle.high.
      (3) Setup 5 Harami: benchmark = post_harami.high, should = inside_bar.high.
      Bearish mirrors had same deviation: HH Sweep, Shooting Star, Bearish Harami.
      Scanner also ran on still-forming last candle (not close-basis).
      Scan results lacked anchor_tf and entry_tf labeling.
    root_cause: |
      BCD scanner always set benchmark = float(a['high']) where a = df.iloc[a_idx].
      For Setup 2/4/5 the actual A candle sits at a_idx-1 because those anchor
      functions look at df.iloc[-4] as A while the loop variable a = df.iloc[-3].
      So benchmark was computed from the candle AFTER the true A candle.
    affected_files:
      - common/trading_core.py
      - Trade_Stock/stock_reversal_scanner.py
    resolution: |
      1. Added BenchmarkPrice key to 6 anchor functions (3 bull + 3 bear mirrors)
         returning the actual A candle high (bull) or low (bear).
      2. BCD scanner now uses anchor_match.BenchmarkPrice when present,
         falling back to float(a.high) for Setup 1 and 3 which were already correct.
      3. Close-basis: df.iloc[:-1].copy() trim added to 4 scan functions so only
         fully-closed candles are evaluated.
      4. TF labeling: anchor_tf and entry_tf params added to scan_anchor_bcd_breakout
         signature, populated in result dict. stock_reversal_scanner.py passes
         TIMEFRAME_ANCHOR and TIMEFRAME_ENTRY values into both live and formed_display
         dicts so the dashboard can show Anchor TF vs Entry TF for each signal.
      Verified: scratch/run_full_regression_test.py 10/10 passed.
    status: RESOLVED
