      was touched and long before the trail existed) retroactively appeared to breach the new SL,
      so the very next monitor pass exited. Same failure class as ISSUE-040: historical bars
      evaluated against a live-updated SL. The live fill was ~80.25 (profitable); the -12.68% PnL
      used the stale 50.60 bar close as the exit price.
