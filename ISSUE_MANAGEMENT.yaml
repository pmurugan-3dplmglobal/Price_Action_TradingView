  - id: ISSUE-015
    title: Zerodha API 200-Day Intraday Query Limit & Missing Registry Tokens (LTIM & TATAMOTORS)
    severity: HIGH
    category: Scanner & API Rate Limit
    date_reported: "2026-08-03"
    symptom: |
      Selecting intraday timeframes (1hr / 75min) caused the scanner to finish instantly (1 second) with "interval exceeds max limit: 200 days" errors for all stocks, and LTIM / TATAMOTORS showed NO_TOKEN.
    root_cause: |
      1. get_adaptive_lookback allowed user_lookback=2000 to pass directly to Zerodha API for intraday timeframes (1hr/75m), exceeding Zerodha's 200-day max query window for intraday candles.
      2. STOCK_REGISTRY was missing LTIM and TATAMOTORS token mappings.
    affected_files:
      - common/trading_core.py
    resolution: |
      1. Updated get_adaptive_lookback to automatically cap intraday lookback at 180 days (complying with Zerodha API limits).
      2. Added LTIM and TATAMOTORS tokens to STOCK_REGISTRY.
    status: RESOLVED

  - id: ISSUE-016
    title: Scanner KeyError Close & TypeError NoneType Formatting Fix
    severity: MEDIUM
    category: Data Normalization & Formatting
    date_reported: "2026-08-03"
    symptom: |
      Scanners threw KeyError 'Close' when evaluating TREND_CONT_BEAR setups, and print_summary threw TypeError unsupported format string passed to NoneType when formatting N/A targets (T2=None).
    root_cause: |
      1. TREND_CONT_BEAR patterns returned key 'Entry' instead of 'Close'.
      2. print_summary attempted direct float formatting on NoneType targets ({m['T2']:<10.2f}).
    affected_files:
      - Trade_Stock/stock_bearish_reversal_scanner.py
      - Trade_Stock/stock_bullish_reversal_scanner.py
    resolution: |
      1. Normalized result['Close'] = result.get('Close') or result.get('Entry').
      2. Applied safe type checking for T1/T2 target formatting in print_summary.
    status: RESOLVED

