  - id: ISSUE-054
    title: Scan Export Shows Mislabeled "NIFTY | BANKNIFTY26AUG57700PE" Active Row With Degenerate RR
    severity: MEDIUM
    category: Symbol Resolution / Display Integrity
    family: BUG_FIX
    date_reported: "2026-08-12"
    symptom: |
      The scan export Active section shows "NIFTY | BANKNIFTY26AUG57700PE" - the underlying is
      mislabeled as NIFTY even though the instrument is a BANKNIFTY option - and the row carries a
      degenerate RR of 610.93. The position (entry 467.95, SL 467.68, T1 632.9) has an SL ~0.27 below
      entry, so (T1-entry)/(entry-SL) explodes to ~611.
    root_cause: |
      1. Registry matching used next((s for s in registry if s in tradingsymbol), None) at 6 sites; dict
         iteration order places 'NIFTY' before 'BANKNIFTY', so 'NIFTY' matched the substring inside
         'BANKNIFTY26AUG57700PE' and was returned as the symbol.
      2. RR is computed as (T1-entry)/risk with only a risk>0 guard; when SL ~= entry (risk ~0.27 vs
         entry 467.95) the ratio becomes astronomically large instead of being suppressed as meaningless.
    affected_files:
      - common/registries.py
      - common/trading_core.py
      - common/resolve.py
      - common/display_writer.py
      - Trade_Option/index_options_trade_engine.py
      - Trade_Option/stock_options_trade_engine.py
      - Trade_Option/templates/index.html
      - Trade_Stock/templates/index.html
    resolution: |
      1. Added match_registry_symbol(registry, tradingsymbol) (common/registries.py + common/trading_core.py)
         and _match_registry_symbol (common/resolve.py) which sort registry keys longest-first, so the
         longest matching underlying wins (BANKNIFTY before NIFTY). Applied to all 6 former
         next(...) sites: trading_core.py sync_kite_positions + reconcile_positions, resolve.py
         sync_kite_positions + reconcile_positions, and both option trade engines' scan-symbol mapping.
      2. Added a degenerate-risk RR guard in build_trade (trading_core.py / resolve.py / display_writer.py):
         risk < max(0.01, |entry|*0.005) now yields RR 0.0 instead of the exploding value. Both dashboard
         templates (renderScanTab) apply the same riskMin threshold when recomputing RR client-side.
      3. Corrected the existing DB row id=29 (symbol NIFTY -> BANKNIFTY) in output/monitor/trades.sqlite3.
      4. Also fixed pre-existing YAML indentation bugs in ISSUE_MANAGEMENT.yaml that made it unparsable
         (ISSUE-044/046/047/048/052 blocks).
      Verified: ast.parse all edited files; match_registry_symbol returns BANKNIFTY for
      BANKNIFTY26AUG57700PE; RR guard yields 0.0 for the degenerate case and correct values otherwise;
      scratch/run_full_regression_test.py 11/11 PASS; both dashboards restarted and index engine
      restarted (recovered position now logged as BANKNIFTY).
    status: RESOLVED

