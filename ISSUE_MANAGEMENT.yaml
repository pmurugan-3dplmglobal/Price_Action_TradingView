         skipped while a post-trail candle is still evaluated.
      Verified: ast.parse all files; scratch/run_full_regression_test.py 11/11 "FLOW" checks pass
         (Test 8 data-only failure: pre-existing expired ACTIVE NIFTY2681124650PE, expiry 08-11).
