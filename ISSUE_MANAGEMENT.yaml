    date_reported: "2026-08-10"
    symptom: |
      Automatic SELL orders for ETERNAL AUG 300 PE (2425 Qty @ 3.35) and HCLTECH AUG 1340 PE (400 Qty @ 22.80) triggered in Zerodha Kite at 09:45:01 AM and 09:45:23 AM.
    root_cause: |
      1. Automated failsafe monitoring was configured to pause before 09:45:00 AM to avoid opening market volatility.
      2. At 09:45:00 AM sharp, the pause expired and the background position monitor evaluated all active positions against recorded SL levels.
      3. Since HCLTECH LTP (22.80) <= SL (24.30) and ETERNAL LTP (3.35) <= SL (4.41), the failsafe engine submitted regular SELL limit orders immediately at 09:45:01 and 09:45:23.
    affected_files:
