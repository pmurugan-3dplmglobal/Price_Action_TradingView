  - id: ISSUE-062
    title: Prevent Zerodha API Order Rate Limit Retry Spam Loops on Entry Failure
    severity: BUG
    category: Trade Execution & Rate Limiting
    family: BUG
    date_reported: "2026-08-13"
    symptom: |
      Index engine logged: "Entry failed for SENSEX2681377900PE: Maximum allowed order requests exceeded" repeatedly every 5 seconds.
    root_cause: |
      When an entry order placement failed (e.g. margin shortfall or initial rate limit), index_options_trade_engine.py did not call trade_db.record_executed_pattern. On the subsequent scan cycle (5-8 seconds later), the engine re-detected the un-recorded pattern and attempted kite.place_order again in a rapid loop, triggering Zerodha's backend rate limiter ("Maximum allowed order requests exceeded").
    affected_files:
      - Trade_Option/index_options_trade_engine.py
      - Trade_Option/stock_options_trade_engine.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      1. Updated execute_highest_rr_trade in index_options_trade_engine.py and stock_options_trade_engine.py to record pattern execution (record_executed_pattern) upon order attempt.
      2. Ensured failed order attempts clean up ACTIVE_POSITIONS and set DB trade status to FAILED rather than retrying every 5 seconds.
      3. Verified all 12 regression tests passed with 100% success.
