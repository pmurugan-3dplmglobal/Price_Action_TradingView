  - id: FEATURE-002
    title: Code Quality & Performance Improvement Pass (Phase 1+2+3+4)
    severity: ENHANCEMENT
    category: Code Quality / Performance / Architecture
    date_reported: "2026-08-11"
    symptom: |
      After full codebase audit:
      (1) trading_core.py was 3,259 lines - a single monolithic file causing maintenance friction.
      (2) NFO instruments CSV (40K+ rows) was re-parsed on every get_option_lot_size() and
          contract_is_expired() call - significant performance drag during position monitoring.
      (3) EXECUTED_EXITS file was re-read from disk on every monitoring cycle call.
      (4) JSON-based trades_db.json had cross-process file corruption risk (no OS-level locking).
      (5) Hardcoded symbol-specific remarks (TECHM, DRREDDY, JSWSTEEL, etc.) embedded in
          daily_trade_journal.py were stale historical annotations from specific trade sessions.
      (6) CWD-relative file paths in daily_trade_journal.py and lookup_scan_sl_target() violated
          ISSUE-038 rules.
      (7) Historical candle cache could grow unbounded over a full trading day.
      (8) Lambda closure in stock_reversal_scanner.py captured only tok by value, other vars by ref.
      (9) Inline timeframe parsing block duplicated in stock_reversal_scanner.py vs get_fetch_timeframe().
      (10) time.sleep(0.2) per symbol in scanner added 10s+ unnecessary delay for 50-stock scans.
      (11) Bare except: clauses swallowed errors silently in trade_db.py.
      (12) Missing common/__init__.py preventing proper package imports.
      (13) requirements.txt had no upper-bound version pins.
      (14) OBEROIRLTY duplicated in both NIFTY_NEXT100 and NIFTY_MIDCAP100 symbol lists.
    root_cause: |
      Organic codebase growth over many iterations without structural refactoring.
      trading_core.py accumulated all functionality over time without module boundaries.
      trades_db.json used file-based retry loops which do not prevent simultaneous
      writes from separate processes (dashboard + scanner + engine).
    affected_files:
      - common/trading_core.py
      - common/trade_db.py
      - common/daily_trade_journal.py
      - common/dashboard_sl_overrides.py
      - common/equity_universe.py
      - Trade_Stock/stock_reversal_scanner.py
      - requirements.txt
    resolution: |
      Phase 1 - trading_core.py performance fixes:
        1. NFO cache: Added _get_nfo_cache() with mtime-based invalidation - CSV parsed once,
           reloaded only when file changes. Eliminates ~40K row re-parse per monitoring call.
        2. EXECUTED_EXITS: Added _EXECUTED_EXITS_MTIME guard - file re-read only on change.
        3. Candle cache: Added eviction when cache exceeds 500 entries (TTL-based cleanup).
        4. Fixed variable shadow: renamed 'paths' local dict to 'display_paths' in
           lookup_scan_sl_target() to stop shadowing the module-level 'import paths'.
        5. Fixed CWD-relative strings in lookup_scan_sl_target() -> paths.SCAN_DISPLAY_* constants.

      Phase 2 - other module fixes:
        6. trade_db.py: Added logging import, replaced bare except: with except Exception:,
           added warning log on _sync_tab_databases failure.
        7. daily_trade_journal.py: Removed all hardcoded symbol-specific remarks and lessons
           (TECHM, DRREDDY, JSWSTEEL, BANKNIFTY, HDFCLIFE, SBIN) - replaced with generic
           outcome-based logic. Fixed CWD paths -> paths.SCAN_DISPLAY_FILE / paths.TRADE_JOURNAL_CSV.
        8. dashboard_sl_overrides.py: Added atomic write (tmp + os.replace) for SL overrides file.
        9. stock_reversal_scanner.py: Replaced 20-line inline timeframe block with
           get_fetch_timeframe() call, fixed lambda closure to capture fd/td/tf by value,
           reduced time.sleep(0.2) -> 0.05 (saves ~8s per 50-stock scan cycle).
        10. equity_universe.py: Removed duplicate OBEROIRLTY from NIFTY_MIDCAP100_SYMBOLS.
        11. requirements.txt: Added upper-bound version pins for all 6 dependencies.

      Phase 3 - trading_core.py decomposition (3,259 -> 9 focused modules):
        Created common/timeframe_utils.py  - LOOKBACK_LIMITS, get_fetch_timeframe, resample, etc.
        Created common/registries.py       - STOCK_REGISTRY, INDEX_REGISTRY, sync_stock_tokens
        Created common/session.py          - load_kite_session, ensure_kite_session, safe_kite_call
        Created common/targets.py          - find_profit_targets (bull+bear), SL/buffer/RR calcs
        Created common/patterns_bull.py    - 5 bullish anchors + BCD scanner + trend continuation
        Created common/patterns_bear.py    - 5 bearish anchors + BCD scanner + trend continuation
        Created common/position_monitor.py - monitor_active_positions, close_position, exit guards
        Created common/display_writer.py   - write_scan_display_data, clean_timestamp
        Created common/resolve.py          - resolve_option_strikes, scan_symbol, derive_sl_targets
        trading_core.py retained as-is for backward compatibility (consumers unchanged).

      Phase 4 - SQLite migration for trade_db.py:
        Replaced JSON-based trades_db.json with SQLite (WAL mode, ACID transactions).
        Auto-migration: existing trades_db.json loaded on first run automatically.
        Public API identical (create_trade, update_trade, get_active_trades, etc.)
        Tab-sync JSON files (active_positions_db.json, journal_trades_db.json) kept for
        dashboard backward compatibility.
        Cycle + executed_pattern stores remain JSON (small, infrequent writes).
        Added common/__init__.py to make common/ a proper Python package.

      Verification: scratch/run_full_regression_test.py - 10/10 tests passed (0 regressions).
    status: COMPLETED

  - id: FEATURE-012
    title: Strict Anchor A.low Closing Basis Invalidation Alignment (Option A)
    severity: ENHANCEMENT
    category: Pattern Engine & Blueprint Alignment
    date_reported: "2026-08-04"
    symptom: |
      Breakout scanner previously checked invalidation against A.low - buffer (e.g. 60.43), allowing candles after C to close below A.low (e.g. 61.50) while remaining above the buffered SL level.
    root_cause: |
      Discrepancy with Master Price Action Blueprint (Page 6), which explicitly mandates "holding above A.low" (A.low floor line) on a closing basis.
    affected_files:
      - common/trading_core.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      Updated scan_anchor_bcd_breakout in common/trading_core.py to strictly enforce Option A invalidation: setup is invalidated if any candle between A and D closes below A.low (a_low floor line), while retaining A.low - buffer (sl_val) for order execution risk-reward and Stop Loss calculations.
    status: RESOLVED

